# .github/workflows/deploy.yml
#
# ─── FRONTEND CI/CD PIPELINE ─────────────────────────────────────────────────
# Deploys the Next.js frontend to EC2 automatically whenever you push.
#
# WORKFLOW:
# 1. Push code to dev or main branch
# 2. GitHub Actions spins up a runner
# 3. Builds the Next.js app (verifies it compiles)
# 4. Connects to EC2 via SSH (using your private key)
# 5. Pulls latest code from GitHub
# 6. Rebuilds the app on the server
# 7. Restarts PM2 (your app restarts automatically)
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy Frontend to EC2

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

env:
  EC2_HOST: 52.6.73.220
  EC2_USER: ec2-user
  EC2_APP_PATH: /home/ec2-user/apps/chatbot-app
  NODE_VERSION: '22'

jobs:

  # ── JOB 1: BUILD & TEST ──────────────────────────────────────────────────
  # Runs on GitHub's servers to verify the code compiles without errors
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Install dependencies and build the Next.js app
      # This catches compilation errors before we deploy to EC2
      - name: Install dependencies
        run: npm install

      - name: Build Next.js app
        run: npm run build

      # Verify that critical files exist and haven't been accidentally deleted
      - name: Verify build output
        run: |
          echo "Checking build outputs..."
          test -d .next || (echo "Missing .next directory" && exit 1)
          test -f package.json || (echo "Missing package.json" && exit 1)
          echo "Build verification passed ✓"

  # ── JOB 2: DEPLOY ────────────────────────────────────────────────────────
  # Runs ONLY on push (not on pull requests)
  # Depends on build job — if build fails, this doesn't run
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      # Use webfactory's SSH action — handles key setup properly
      # This is the standard way to do SSH in GitHub Actions
      - name: Setup SSH connection to EC2
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      # Connect to EC2 and deploy
      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=accept-new ${{ env.EC2_USER }}@${{ env.EC2_HOST }} << 'DEPLOY_SCRIPT'
          set -e  # Exit on any error
          
          echo "=== Starting deployment ==="
          cd ${{ env.EC2_APP_PATH }}
          
          echo "Pulling latest code from GitHub..."
          git fetch origin
          git reset --hard origin/${{ github.ref_name }}
          
          echo "Installing dependencies..."
          npm install
          
          echo "Building Next.js app..."
          npm run build
          
          echo "Restarting PM2..."
          pm2 restart chatbot-app
          
          echo "Waiting for app to be ready..."
          sleep 2
          pm2 status
          
          echo "=== Deployment complete ==="
          DEPLOY_SCRIPT

      - name: Verify deployment
        run: |
          echo "Checking if app is responding..."
          curl -f http://${{ env.EC2_HOST }}/health || \
            (echo "Health check failed" && exit 1)
          echo "App is responding ✓"

      - name: Deployment summary
        if: always()
        run: |
          echo "## Frontend Deployment Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Server | ${{ env.EC2_HOST }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Time | $(date -u) |" >> $GITHUB_STEP_SUMMARY